<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FCF9F8" />
    <meta name="description" content="CartPilot 女性补给站：运动营养、经期关怀、女性营养素，AI 按你的身体和周期帮你挑。" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CartPilot" />
    <title>CartPilot · 她的补给站</title>
    <style>
      /* Boot splash: painted with the HTML, faded out by main.tsx once the app is ready. */
      #splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: radial-gradient(120% 80% at 50% 0%, #FBE7EC 0%, #FCF9F8 60%); color: #2E2328; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
        transition: opacity 360ms cubic-bezier(.165,.84,.44,1), transform 360ms cubic-bezier(.165,.84,.44,1); }
      [data-theme="dark"] #splash { background: radial-gradient(120% 80% at 50% 0%, #3A242B 0%, #141012 60%); color: #F2ECE4; }
      #splash .mark { width: 64px; height: 64px; border-radius: 20px; display: flex; align-items: center; justify-content: center; background: #C46F82; color: #fff;
        box-shadow: 0 12px 32px rgba(196, 111, 130, 0.35); animation: splash-breathe 1.6s ease-in-out infinite; }
      #splash .name { font-family: Georgia, "Times New Roman", serif; font-size: 30px; letter-spacing: .3px; margin-top: 4px; }
      #splash .tag { font-size: 14px; opacity: .65; letter-spacing: 2px; }
      #splash .bar { width: 120px; height: 3px; border-radius: 3px; margin-top: 18px; background: rgba(196, 111, 130, 0.18); overflow: hidden; }
      #splash .bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 3px; background: #C46F82; animation: splash-slide 1.1s ease-in-out infinite; }
      #splash.out { opacity: 0; transform: scale(1.02); pointer-events: none; }
      .splash-skip #splash { display: none; }
      @keyframes splash-breathe { 50% { transform: scale(1.06); } }
      @keyframes splash-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #splash .mark, #splash .bar::after { animation: none; } }
    </style>
    <script>
      // Show the splash once per browser session (cold start); later reloads skip it.
      try { if (sessionStorage.getItem('cartpilot.booted')) document.documentElement.classList.add('splash-skip') } catch (e) {}
      // Apply the saved theme before first paint so dark mode does not flash light.
      (function () {
        try {
          var c = localStorage.getItem('cartpilot.theme') || 'system'
          var dark = c === 'dark' || (c === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="splash" role="status" aria-label="CartPilot 正在启动">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6.5 10.5h19l-1.4 15.2a2 2 0 0 1-2 1.8H9.9a2 2 0 0 1-2-1.8z" />
          <path d="M11.5 13.5V9a4.5 4.5 0 0 1 9 0v4.5" />
          <path d="M16 15.5c.35 2.4 1.1 3.15 3.5 3.5-2.4.35-3.15 1.1-3.5 3.5-.35-2.4-1.1-3.15-3.5-3.5 2.4-.35 3.15-1.1 3.5-3.5z" />
        </svg>
      </div>
      <div class="name">CartPilot</div>
      <div class="tag">她的运动与营养补给站</div>
      <div class="bar" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
